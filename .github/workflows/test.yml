name: Test Newsletter Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package extension
        run: npm run package -- --out aviators-newsletter.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: aviators-newsletter-vsix
          path: aviators-newsletter.vsix
          if-no-files-found: error
