name: Deploy Newsletter Agent

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after tests pass'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  infra:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      container-app-url: ${{ steps.deploy-bicep.outputs.containerAppUrl }}
      swa-token: ${{ steps.deploy-bicep.outputs.staticWebAppDeploymentToken }}
      acr-login-server: ${{ steps.deploy-bicep.outputs.acrLoginServer }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        id: deploy-bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/main.bicepparam
          failOnStdErr: false

  deploy-agent:
    needs: [test, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to ACR
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --image aviators-agent:${{ github.sha }} \
            --image aviators-agent:latest \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ needs.infra.outputs.acr-login-server }}/aviators-agent:${{ github.sha }}

  deploy-ui:
    needs: [test, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI
        env:
          VITE_API_BASE: ${{ needs.infra.outputs.container-app-url }}
        run: |
          cd ui
          npm ci
          npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.infra.outputs.swa-token }}
          action: upload
          app_location: ui/dist
          skip_app_build: true
