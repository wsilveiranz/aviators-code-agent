name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set package version from release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          npm pkg set "version=$version"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package extension
        run: npm run package -- --out "aviators-newsletter-${GITHUB_REF_NAME#v}.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: aviators-newsletter-vsix
          path: aviators-newsletter-*.vsix
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: aviators-newsletter-vsix
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          vsix="$(find release-assets -maxdepth 1 -name 'aviators-newsletter-*.vsix' -type f -print -quit)"
          test -f "$vsix"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$vsix" --clobber
          else
            gh release create "$TAG_NAME" "$vsix" \
              --verify-tag \
              --generate-notes \
              --title "$TAG_NAME"
          fi
